plugins {
    alias(libs.plugins.android.application)
    //id 'com.android.application' version '8.0.2' apply false
    alias(libs.plugins.jetbrains.kotlin.android)
}

android {
    def releaseStore = file('bandtotp.jks')
    signingConfigs {
        create("release") {
            if (releaseStore.exists()) {
                keyAlias 'bandtotp'
                keyPassword 'bandtotp'
                storeFile releaseStore
                storePassword 'bandtotp'
            }
        }
    }
    namespace 'com.lst.bandtotp'
    compileSdk 34

    defaultConfig {
        applicationId "com.lst.bandtotp"
        minSdk 27
        targetSdk 34
        versionCode 5
        versionName "2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        debug {
            if (releaseStore.exists()) {
                signingConfig signingConfigs.getByName("release")
            }
        }
        release {
            if (releaseStore.exists()) {
                signingConfig signingConfigs.getByName("release")
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.tooling.preview
    implementation libs.material3 // 确保使用 Material3 的最新版本
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.material
    implementation libs.google.accompanist.systemuicontroller
    implementation libs.zxing.core
    implementation libs.brotli.dec
    implementation libs.androidx.camera.core
    implementation libs.androidx.camera.camera2
    implementation libs.androidx.camera.lifecycle
    implementation libs.androidx.camera.view
    implementation files('libs/xms-wearable-lib_1.4_release.aar')

    testImplementation libs.junit
    testImplementation 'org.json:json:20240303'
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.ui.test.junit4
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}